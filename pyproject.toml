[project]
name = "jobpilot"
version = "0.1.0"
description = "Job-search autopilot: applies on job boards, drafts outreach, and sends only what you approve on Telegram."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "playwright>=1.50",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "pypdf>=5",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.setuptools.package-data]
jobpilot = ["templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["browser: drives Google Chrome through Playwright (skipped when Chrome is unavailable)"]
